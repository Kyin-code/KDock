<!doctype html>
<html lang="zh-CN" data-lang="zh" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KDock Shortcuts Vite Test</title>
  <link rel="stylesheet" href="/src/styles.css" />
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { display: flex; background: hsl(var(--background)); color: hsl(var(--foreground)); }
    #host {
      width: min(920px, 96vw); height: min(760px, 94vh); margin: auto;
      background: var(--surface-1); border: 1px solid var(--surface-line);
      border-radius: 14px; padding: 14px 18px 22px;
    }
  </style>
</head>
<body>
  <div id="host" class="modalcontent">
    <div id="shortcut-test-root" class="setpane" data-setpane="shortcuts"></div>
  </div>
  <script type="module">
    import { createShortcutManager, mountShortcutSettings } from "/src/shortcuts.js";

    localStorage.removeItem("kdock_shortcuts");
    window.__shortcutCalls = [];
    const manager = createShortcutManager({
      storage: localStorage,
      target: window,
      handlers: {
        "nav.link": () => window.__shortcutCalls.push("nav.link"),
        "app.help": () => window.__shortcutCalls.push("app.help"),
      },
      canRun: () => true,
    });
    manager.install();
    const ui = mountShortcutSettings({
      root: document.getElementById("shortcut-test-root"),
      manager,
      getLang: () => "zh",
    });
    window.__shortcutManager = manager;
    window.__shortcutUi = ui;
    document.documentElement.dataset.shortcutsReady = "1";
  </script>
</body>
</html>
