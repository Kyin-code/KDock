<!doctype html>
<html lang="zh-CN" data-lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KDock Runtime Graph Vite Test</title>
  <link rel="stylesheet" href="/src/styles.css" />
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { display: flex; background: hsl(var(--background)); color: hsl(var(--foreground)); }
    #test-root { display: flex; flex: 1; min-width: 0; min-height: 0; }
    #test-root > .rtwork { flex: 1; min-width: 0; height: 100%; }
    #test-root > .parampane { width: 330px; height: 100%; overflow: auto; padding: 10px; }
    #test-toast { position: fixed; left: 12px; bottom: 12px; z-index: 9999; }
  </style>
</head>
<body>
  <div id="test-root"></div>
  <div id="test-toast" class="hint"></div>
  <script type="module">
    window.kdockToast = (text) => {
      const el = document.getElementById("test-toast");
      if (el) el.textContent = String(text);
    };
    window.kdockUiScale = () => 1;

    const source = await fetch("/index.html").then((r) => r.text());
    const parsed = new DOMParser().parseFromString(source, "text/html");
    const root = document.getElementById("test-root");
    const work = parsed.querySelector('[data-work="runtime"]');
    const params = parsed.querySelector('[data-param="runtime"]');
    if (!work || !params) throw new Error("Runtime graph markup missing from index.html");
    work.hidden = false;
    params.hidden = false;
    root.append(work, params);

    localStorage.setItem("kdock_rt_last_file", "D:\\Kyin\\Kyin_Code\\STM32\\HPF-104Pro\\MDK-ARM\\hpf416serial.elf");
    await import("/src/runtime-graph.js");
    await window.rtInit();
    await window.rtAnalyze();
    document.documentElement.dataset.viteTestReady = "1";
  </script>
</body>
</html>
