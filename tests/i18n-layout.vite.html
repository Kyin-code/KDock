<!doctype html>
<html lang="zh-CN" data-lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KDock i18n Layout Vite Test</title>
  <link rel="stylesheet" href="/src/styles.css" />
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { display: block; background: hsl(var(--background)); color: hsl(var(--foreground)); }
    #i18n-host { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="i18n-host"></div>
  <script type="module">
    import { applyDomLanguage, createI18n, syncDataLanguage } from "/src/i18n.js";
    import { initAdvancedNav, openAdvancedNavFor } from "/src/nav-advanced.js";

    const source = await fetch("/index.html").then((response) => response.text());
    const parsed = new DOMParser().parseFromString(source, "text/html");
    const host = document.getElementById("i18n-host");
    const fragment = document.createDocumentFragment();
    for (const node of [...parsed.body.cloneNode(true).childNodes]) {
      if (node.nodeType === Node.ELEMENT_NODE && node.tagName === "SCRIPT") continue;
      fragment.appendChild(node);
    }
    host.appendChild(fragment);

    const instance = createI18n(window.__I18N_EN__ || {}, "zh");
    const advanced = initAdvancedNav();
    const debug = document.querySelector('.navitem[data-tab="debug"]');
    if (debug) debug.hidden = true;
    advanced.refreshCount();

    const WORK_OF = {
      link: "shell", upgrade: "shell", files: "files", cmds: "shell",
      chart: "chart", seq: "seq", flash: "flash", scope: "scope",
      capture: "capture", logic: "logic", agent: "agent", env: "env",
      usb: "usb", kb: "kb", adb: "adb",
    };
    const pages = [...document.querySelectorAll(".navitem[data-tab]")]
      .map((element) => element.dataset.tab)
      .filter((value, index, all) => all.indexOf(value) === index);

    window.__showI18nPage = (tab) => {
      const work = WORK_OF[tab] || tab;
      for (const element of document.querySelectorAll("[data-work]")) {
        element.hidden = element.dataset.work !== work;
      }
      for (const element of document.querySelectorAll("[data-param]")) {
        element.hidden = element.dataset.param !== tab;
      }
      for (const element of document.querySelectorAll(".navitem[data-tab]")) {
        element.classList.toggle("active", element.dataset.tab === tab);
      }
      openAdvancedNavFor(tab, false);
      document.documentElement.dataset.tab = tab;
    };

    window.__showI18nSettings = (pane = "general") => {
      const modal = document.getElementById("settings-modal");
      if (!modal) return;
      modal.hidden = false;
      for (const tab of document.querySelectorAll(".modaltab")) {
        tab.classList.toggle("active", tab.dataset.set === pane);
      }
      for (const page of document.querySelectorAll(".setpane")) {
        page.hidden = page.dataset.setpane !== pane;
      }
    };

    window.__hideI18nSettings = () => {
      const modal = document.getElementById("settings-modal");
      if (modal) modal.hidden = true;
    };

    window.__setI18nLanguage = (language) => {
      applyDomLanguage(host, instance, language);
      syncDataLanguage(host, language);
      document.documentElement.dataset.lang = language;
    };
    window.__setI18nLanguage("zh");

    window.__i18nPages = pages;
    document.documentElement.dataset.i18nReady = "1";
  </script>
</body>
</html>
