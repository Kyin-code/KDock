<!doctype html>
<html lang="zh-CN" data-lang="zh" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KDock Agent Session Meta Vite Test</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <section class="agentpane" style="width:720px;height:560px;margin:24px auto">
    <div class="aghead"><b id="ag-title">新会话</b><span id="ag-turns"></span></div>
    <div id="ag-chat" class="agentchat">
      <div class="agmsg user"><div class="bubble">检查标题即时刷新</div></div>
      <div class="agmsg assistant"><div class="head"><span class="who">Agent</span></div><div class="bubble">收到。</div></div>
    </div>
  </section>
  <script type="module">
    import {
      agentDisplayName,
      assistantMetaText,
      countUserTurns,
      eventTimeText,
      mergeSessionMeta,
      sessionMetaDisplayChanged,
      sessionSpeaker,
    } from "/src/agent-session.js";

    const before = { id: "session-live", title: "新会话", user_name: "", agent_name: "" };
    const incoming = {
      id: "session-live", title: "修复首轮会话标题", user_name: "任工", agent_name: "KDock",
      turns: 1,
    };
    const after = mergeSessionMeta(before, incoming);
    document.getElementById("ag-title").textContent = after.title;
    const eventTurns = [
      { type: "user" }, { type: "assistant" }, { type: "tool_call" },
      { type: "tool_result" }, { type: "assistant" }, { type: "user" },
    ];
    document.getElementById("ag-turns").textContent = `${countUserTurns(eventTurns)} 轮`;
    document.querySelector("#ag-chat .agmsg.assistant .who").textContent = sessionSpeaker(after, "assistant");

    const other = mergeSessionMeta(after, { id: "another-session", title: "不应覆盖" });
    const metaEvent = { model: "deepseek-flash", ts: Date.now() };
    window.__agentSessionMeta = {
      before,
      incoming,
      after,
      other,
      changed: sessionMetaDisplayChanged(before, after),
      unchanged: sessionMetaDisplayChanged(after, { ...after }),
      runningMeta: assistantMetaText(metaEvent, true),
      finishedMeta: assistantMetaText(metaEvent, false),
      agentDisplayName: agentDisplayName(after),
      defaultAgentDisplayName: agentDisplayName({ agent_name: "Agent" }),
      countedUserTurns: countUserTurns(eventTurns),
      userLabelsRendered: document.querySelectorAll("#ag-chat .agmsg.user .who").length,
      userSpeaker: sessionSpeaker(after, "user"),
      userTime: eventTimeText(Date.now()),
    };
    document.documentElement.dataset.agentSessionReady = "1";
  </script>
</body>
</html>
