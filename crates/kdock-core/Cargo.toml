[package]
name = "kdock-core"
version.workspace = true
edition.workspace = true
description = "UI-agnostic protocol/logic layer for the serial debug tool"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4.7"
socket2 = { version = "0.5", features = ["all"] }

