[package]
name = "kdock"
version.workspace = true
edition.workspace = true
description = "KDock - embedded debug workbench (serial / network / firmware / agent)"

[lib]
name = "kdock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
image = { version = "0.24.9", features = ["jpeg", "png"] }
screenshots = "0.8.10"
# image-png：内嵌 icons/icon.png 做兜底图标（任务栏/托盘都要）
# unstable：多 WebView（窗口里嵌子 WebView）——「知识库」页要把外部页面（Dify 这类
# 需要跑 JS 的界面）真渲染出来，只能靠 WebView2 子视图，HTML 里的 iframe 被 CSP 挡着用不了。
tauri = { version = "2", features = ["tray-icon", "image-png", "unstable"] }
# 原生文件对话框 + 文件读写（用来替代 WebView 里空实现的 window.prompt）
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# 窗口位置/大小记忆、开机自启
tauri-plugin-window-state = "2"
# 单实例：第二次双击 exe 时把已有窗口叫到前面，而不是去开第二个 WebView2
# （同一个用户数据目录被两个实例抢，WebView2 会直接失败：HRESULT(0x8007139F)，
#   表现就是"打不开/闪退"——实测踩过）
tauri-plugin-single-instance = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serialport = "4.7"
kdock-core = { path = "../crates/kdock-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
# 文件校验（计算器右栏那个"选文件算 CRC/哈希"）：CRC 自己算，哈希用 RustCrypto
crc32fast = "1"
digest = "0.10"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
ureq = { version = "2.12", default-features = false, features = ["tls", "json", "proxy-from-env"] }
# FTPS（隐式/显式 TLS）与 VNC 的 TLS：rustls 仓库里本来就通过 ureq 在用（Apache-2.0/MIT/ISC），
# 这里只是把同一棵依赖树里的版本显式引出来；webpki-roots 提供系统信任根。
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"
des = "0.9.0"

# 只有 Windows 才有的：开机自启、屏幕捕获（DXGI）
[target.'cfg(windows)'.dependencies]
tauri-plugin-autostart = "2"
# USB 诊断页：SetupAPI（枚举设备）+ Hub IOCTL（端口 / 设备描述符）。不装驱动。
windows-sys = { version = "0.60", features = [
  "Win32_Foundation",
  "Win32_Devices_Usb",
  "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_Storage_FileSystem",
  "Win32_Security",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_System_Threading",
  "Win32_System_Registry",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
] }
