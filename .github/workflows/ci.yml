name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    # The self-hosted build machine has Windows Application Control enabled and
    # rejects newly built, unsigned test executables with os error 4551. Run all
    # code-executing checks on an ephemeral GitHub-hosted runner instead.
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain versions
        run: |
          rustc --version
          cargo --version
          node --version
          npm --version

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        run: npm run build

      - name: Check frontend bundle budget
        run: npm run test:bundle

      - name: Test shared browser contract
        run: npm run test:browser

      - name: Test i18n coverage
        run: npm run test:i18n

      - name: Test bilingual responsive UI
        run: npm run test:i18n:ui

      - name: Test lazy page modules
        run: npm run test:lazy

      - name: Test responsive UI matrix
        run: npm run test:vite:pages

      # A cold Windows PowerShell start can take much longer on a fresh hosted
      # runner than on a developer machine. Warm it once before the Rust suite,
      # which contains several real PowerShell process tests.
      - name: Warm Windows PowerShell
        timeout-minutes: 2
        run: powershell.exe -NoLogo -NoProfile -NonInteractive -Command 'Write-Output "powershell-ready"'

      - name: Test workspace
        # Process-tree and shell tests start real Windows children. Running the
        # test binaries serially avoids cold-start/cache contention on 2-core
        # hosted runners while still exercising every test.
        run: cargo test --workspace --locked -- --test-threads=1

      - name: Test agent activity grouping
        run: npm run test:activity

      - name: Test terminal and transfer log behavior
        run: npm run test:transfer

      - name: Test SSH connection history
        run: npm run test:ssh

      - name: Test update manifest contract
        run: npm run test:update

      - name: Check workspace
        run: cargo check --workspace --locked

  build:
    needs: verify
    # Build on the dedicated self-hosted Windows machine. Smart App Control is
    # intentionally disabled there because it blocks newly generated unsigned
    # Cargo build-script executables. Never execute code coming from a fork.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [ self-hosted, windows, kdock ]
    # Publishing a release needs write access; everything else in this job stays read-only.
    permissions:
      contents: write
    timeout-minutes: 120
    env:
      # Persistent cargo cache outside the checkout, so that
      # actions/checkout's `git clean -ffdx` cannot wipe it.
      CARGO_TARGET_DIR: D:/CI/cargo-target/kdock
      KDOCK_BUILD_ID: ${{ github.sha }}
      KDOCK_RELEASE_BUILD: ${{ github.event_name != 'pull_request' && '1' || '0' }}
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Smart App Control state
        run: |
          $state = (Get-ItemProperty `
            -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\CI\Policy' `
            -Name VerifiedAndReputablePolicyState).VerifiedAndReputablePolicyState
          if ($state -ne 0) {
            throw "Smart App Control must be disabled on the KDock CI runner (state=$state)"
          }
          Write-Output "Smart App Control: disabled"

      - name: Link cargo target directory
        # Why this exists: tauri-build resolves the plugin permission files under
        # <repo>/target, but CARGO_TARGET_DIR points outside the checkout - the build
        # script then dies with "failed to read plugin permissions ... app_hide.toml".
        # A junction makes both paths the same directory. `git clean -ffdx` (run by
        # checkout) deletes the link itself but leaves the cache behind - verified on
        # the runner, so the cache still survives across runs.
        if: env.CARGO_TARGET_DIR != ''
        run: |
          $real = $env:CARGO_TARGET_DIR
          New-Item -ItemType Directory -Force $real | Out-Null
          $link = Join-Path $PWD "target"
          if (Test-Path $link) {
            $item = Get-Item $link -Force
            if ($item.LinkType) { Remove-Item $link -Force } else { Remove-Item $link -Recurse -Force }
          }
          New-Item -ItemType Junction -Path $link -Target $real | Out-Null
          Write-Output "linked $link -> $real"

      - name: Toolchain versions
        run: |
          rustc --version
          cargo --version
          node --version
          npm --version

      - name: Install Semifold
        run: |
          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $env:USERPROFILE ".cargo" }
          $bin = Join-Path $cargoHome "bin"
          $env:PATH = "$bin;$env:PATH"
          if (-not (Get-Command smif -ErrorAction SilentlyContinue)) {
            cargo install semifold --version 0.3.4 --locked
          }
          smif --version
          "SMIF_BIN=$bin" >> $env:GITHUB_ENV

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        run: npm run build

      - name: Build portable firmware analyzer
        run: |
          # build-portable.ps1 uses uv when present and otherwise bootstraps
          # pip with the official get-pip.py, so CI does not require uv.
          pwsh -NoProfile -ExecutionPolicy Bypass -File tools/bingraph/build-portable.ps1 -NoGraphviz
          if (-not (Test-Path resources/bingraph/python/python.exe)) {
            throw "portable analyzer was not produced"
          }
          if (-not (Test-Path resources/bingraph/run.py)) {
            throw "portable analyzer entry point is missing"
          }
          if (-not (Test-Path resources/bingraph/THIRD_PARTY_NOTICES.md)) {
            throw "portable analyzer third-party notices are missing"
          }
          if (Test-Path resources/bingraph/build-tools) {
            throw "portable analyzer leaked temporary build tools"
          }
          $py = "resources/bingraph/python/python.exe"
          $check = & $py -c "import sys; assert 'build-tools' not in ' '.join(sys.path); import angr, bingraph; print(sys.version.split()[0], angr.__version__, bingraph.__version__)"
          if ($LASTEXITCODE -ne 0) {
            throw "portable analyzer import self-check failed"
          }
          $pth = Get-Content "resources/bingraph/python/python313._pth" -Raw
          if ($pth -match [regex]::Escape($env:TEMP)) {
            throw "portable analyzer _pth still points into the build staging directory"
          }
          Write-Output "portable analyzer self-check: $check"

      - name: Build Tauri app (release)
        run: |
          # CARGO_TARGET_DIR is persistent on the self-hosted runner. Remove the
          # previous NSIS output so a stale installer cannot satisfy the staging
          # step when this build fails to produce one.
          $nsis = "$env:CARGO_TARGET_DIR\release\bundle\nsis"
          if (Test-Path -LiteralPath $nsis) {
            Remove-Item -LiteralPath $nsis -Recurse -Force
          }
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $ver = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
            if ("v$ver" -ne $env:GITHUB_REF_NAME) {
              throw "tag $env:GITHUB_REF_NAME does not match app version v$ver"
            }
            $env:KDOCK_VERSION_PREPARED = "1"
          } else {
            $env:PATH = "$env:SMIF_BIN;$env:PATH"
            smif --version
          }
          npm run tauri build

      - name: Stage artifacts
        run: |
          # The frontend is compiled into the executable by `tauri build`,
          # so the dist folder is a build intermediate and must not ship.
          New-Item -ItemType Directory -Force release | Out-Null
          $exe = "$env:CARGO_TARGET_DIR\release\kdock.exe"
          if (-not (Test-Path -LiteralPath $exe)) { throw "kdock.exe was not produced" }
          Copy-Item -LiteralPath $exe -Destination release -Force
          Get-ChildItem release -Recurse -File -Name

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kdock-windows-x64
          if-no-files-found: error
          path: release/**

      - name: Stage installer
        if: github.event_name != 'pull_request'
        run: |
          # `tauri build` produces the NSIS installer under the cargo target dir.
          $nsis = "$env:CARGO_TARGET_DIR\release\bundle\nsis"
          $ver = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $name = "KDock_${ver}_x64-setup.exe"
          $setup = Get-ChildItem -LiteralPath $nsis -Filter $name -File -ErrorAction SilentlyContinue
          if (-not $setup) {
            throw "expected NSIS installer was not produced: $name"
          }
          Copy-Item -LiteralPath $setup.FullName -Destination release -Force
          Get-ChildItem release -Recurse -File -Name

      - name: Commit automatic Semifold version
        id: version_commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          $ver = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md package.json package-lock.json Cargo.toml Cargo.lock `
            crates/kdock-core/Cargo.toml crates/kdock-core/CHANGELOG.md `
            src-tauri/Cargo.toml src-tauri/CHANGELOG.md src-tauri/tauri.conf.json .changes
          if (git diff --cached --quiet) {
            throw "Semifold did not produce a version change"
          }
          git commit -m "chore(release): v$ver [skip ci]"
          git push origin HEAD:main
          $sha = (git rev-parse HEAD).Trim()
          "sha=$sha" >> $env:GITHUB_OUTPUT
          "version=$ver" >> $env:GITHUB_OUTPUT
          Write-Output "committed automatic version v$ver at $sha"

      - name: Package portable zip
        if: github.event_name != 'pull_request'
        id: pack
        run: |
          $ver = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $sha = "${{ github.sha }}".Substring(0, 7)
          $name = "KDock-$ver-test-$sha-win-x64"
          New-Item -ItemType Directory -Force "pack/$name" | Out-Null
          Copy-Item release/kdock.exe "pack/$name/KDock.exe" -Force
          # Keep the layout the app expects:
          #   <root>\resources\bingraph\python\python.exe
          #   <root>\tools\bingraph\build-portable.ps1
          New-Item -ItemType Directory -Force "pack/$name/resources/bingraph" | Out-Null
          Copy-Item resources/bingraph/* "pack/$name/resources/bingraph" -Recurse -Force
          New-Item -ItemType Directory -Force "pack/$name/tools/bingraph" | Out-Null
          Copy-Item tools/bingraph/* "pack/$name/tools/bingraph" -Recurse -Force
          Copy-Item README.md "pack/$name/README.md" -Force
          Copy-Item LICENSE "pack/$name/LICENSE" -Force
          Copy-Item NOTICE "pack/$name/NOTICE" -Force
          if (-not (Test-Path "pack/$name/resources/bingraph/python/python.exe")) {
            throw "portable ZIP is missing the bundled Python runtime"
          }
          if (-not (Test-Path "pack/$name/tools/bingraph/build-portable.ps1")) {
            throw "portable ZIP is missing the analyzer repair script"
          }
          $note = @(
            "KDock test build (portable, no install needed)",
            "==============================================",
            "1) Unzip and double-click KDock.exe (keep resources/ and tools/ beside it).",
            "2) The binary is not code-signed: Windows SmartScreen may warn",
            "   -> More info -> Run anyway.",
            "3) Needs the WebView2 Runtime (usually bundled with Windows 10/11;",
            "   if it is missing the app offers to install it on first start).",
            "4) This is a TEST build, for trying things out and giving feedback.",
            "",
            "KDock 测试版（免安装）",
            "1) 解压后双击 KDock.exe 即可运行；",
            "2) 未做代码签名，首次运行可能被 SmartScreen 拦一下（更多信息 -> 仍要运行）；",
            "3) 需要 WebView2 Runtime，Win10/11 一般自带；",
            "4) 这是测试版，请别用在生产环境。"
          ) -join "`r`n"
          Set-Content -Path "pack/$name/README-first.txt" -Value $note -Encoding UTF8
          Compress-Archive -Path "pack/$name/*" -DestinationPath "pack/$name.zip" -Force
          $ref = "${{ github.ref }}"
          $tag = if ($ref.StartsWith("refs/tags/v")) { "${{ github.ref_name }}" } else { "test-latest" }
          $repo = "${{ github.repository }}"
          $setupName = "KDock_${ver}_x64-setup.exe"
          $setup = Get-Item -LiteralPath "release/$setupName" -ErrorAction SilentlyContinue
          if (-not $setup) { throw "installer is required for the update manifest" }
          $installerSha256 = (Get-FileHash -LiteralPath $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $notes = if ("${{ steps.version_commit.outputs.sha }}") {
            (git log -2 --pretty=%s)[1]
          } else {
            (git log -1 --pretty=%s).Trim()
          }
          node scripts/release-manifest.mjs `
            --output release/kdock-update.json `
            --version $ver `
            --build "${{ github.sha }}" `
            --installer-url "https://github.com/$repo/releases/download/$tag/$($setup.Name)" `
            --installer-sha256 $installerSha256 `
            --portable-url "https://github.com/$repo/releases/download/$tag/$name.zip" `
            --release-url "https://github.com/$repo/releases/tag/$tag" `
            --notes "$notes"
          if ($LASTEXITCODE -ne 0) { throw "update manifest generation failed" }
          "zip=pack/$name.zip" >> $env:GITHUB_OUTPUT
          Get-ChildItem pack -File -Name

      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $repo  = "${{ github.repository }}"
          $buildSha = "${{ github.sha }}"
          $short = $buildSha.Substring(0, 7)
          $ref   = "${{ github.ref }}"
          $releaseSha = "${{ steps.version_commit.outputs.sha }}"
          if (-not $releaseSha) { $releaseSha = $buildSha }
          $ver   = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $stamp = (Get-Date).ToUniversalTime().ToString("yyyyMMdd-HHmm")
          # A v* tag push becomes a normal release. A push to main keeps ONE rolling
          # pre-release (tag `test-latest`), so there is a single stable download link
          # instead of a growing pile of builds, and it is always marked Pre-release.
          $isStable = $ref.StartsWith("refs/tags/v")
          $tag = if ($isStable) { "${{ github.ref_name }}" } else { "test-latest" }
          $head = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept        = "application/vnd.github+json"
            "User-Agent"  = "kdock-ci"
          }
          $body = @(
            $(if ($isStable) { "**KDock $ver**" } else { "> WARNING: this is an automatically built **TEST build** (pre-release), NOT a stable version. 这是自动构建的**测试版**，不是正式版本。" }),
            $(if ($isStable) { "" } else { "> It may crash or change your settings - please back up first and do not use it in production. 可能崩溃、可能改你的配置；请先备份，别用在生产环境。" }),
            "",
            "## Downloads",
            "- **KDock-$ver-test-$short-win-x64.zip** - portable: unzip and run KDock.exe (includes the portable analyzer)",
            "- **KDock_$ver`_x64-setup.exe** - installer: Start menu entry + uninstaller (no admin needed)",
            "- **kdock.exe** - the bare executable",
            "",
            "The binaries are not code-signed: Windows SmartScreen may warn on first launch (More info -> Run anyway).",
            "The WebView2 Runtime is required (usually present on Windows 10/11).",
            "",
            "Build: commit $short, $((Get-Date).ToUniversalTime().ToString("yyyy-MM-dd HH:mm")) UTC, version $ver.",
            "This download always points at the newest build from `main`.",
            "",
            "Feedback: https://github.com/$repo/issues"
          ) -join "`n"
          $payload = @{
            tag_name         = $tag
            name             = if ($isStable) { "KDock $ver" } else { "KDock test build $ver (latest: $stamp, $short)" }
            body             = $body
            draft            = $false
            prerelease       = -not $isStable
            target_commitish = $releaseSha
          } | ConvertTo-Json -Depth 6
          # Existing rolling release? Then wipe its old assets and update it in place.
          $existing = $null
          try {
            $existing = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/releases/tags/$tag" -Headers $head
          } catch { $existing = $null }
          if ($existing) {
            foreach ($a in @($existing.assets)) {
              Invoke-RestMethod -Method Delete -Uri "https://api.github.com/repos/$repo/releases/assets/$($a.id)" -Headers $head | Out-Null
              Write-Output "removed old asset: $($a.name)"
            }
            $rel = Invoke-RestMethod -Method Patch -Uri "https://api.github.com/repos/$repo/releases/$($existing.id)" `
              -Headers $head -ContentType "application/json" -Body ([Text.Encoding]::UTF8.GetBytes($payload))
            # Use the id we already know: do not depend on what PATCH echoes back.
            $relId = $existing.id
            $relUrl = if ($rel.html_url) { $rel.html_url } else { $existing.html_url }
            Write-Output "updated release: $relUrl"
          } else {
            $rel = Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$repo/releases" `
              -Headers $head -ContentType "application/json" -Body ([Text.Encoding]::UTF8.GetBytes($payload))
            $relId = $rel.id
            $relUrl = $rel.html_url
            Write-Output "created release: $relUrl"
          }
          $assets = @("${{ steps.pack.outputs.zip }}", "release/kdock.exe", "release/kdock-update.json")
          $assets += (Get-ChildItem release -Filter *setup.exe -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName })
          foreach ($f in $assets) {
            $n = Split-Path $f -Leaf
            Invoke-RestMethod -Method Post -Headers $head -ContentType "application/octet-stream" `
              -Uri "https://uploads.github.com/repos/$repo/releases/$relId/assets?name=$([uri]::EscapeDataString($n))" `
              -InFile $f | Out-Null
            Write-Output "uploaded: $n"
          }
          # Keep the rolling tag pointing at the build that is actually attached to it.
          if (-not $isStable) {
            try {
              $refPayload = @{ sha = $releaseSha; force = $true } | ConvertTo-Json
              Invoke-RestMethod -Method Patch -Uri "https://api.github.com/repos/$repo/git/refs/tags/$tag" `
                -Headers $head -ContentType "application/json" -Body $refPayload | Out-Null
              Write-Output "moved tag $tag -> $short"
            } catch {
              Write-Warning "could not move tag $tag (release itself is fine): $($_.Exception.Message)"
            }
          }
          "### Release: $tag -> $relUrl" >> $env:GITHUB_STEP_SUMMARY
