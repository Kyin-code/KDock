name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

env:
  # Persistent cargo cache outside the checkout, so that
  # actions/checkout's `git clean -ffdx` cannot wipe it.
  CARGO_TARGET_DIR: D:/CI/cargo-target/kdock

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # The runner is a physical machine, so never execute code coming from a fork.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [ self-hosted, windows, kdock ]
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain versions
        run: |
          rustc --version
          cargo --version
          node --version
          npm --version

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        run: npm run build

      - name: Test kdock-core
        run: cargo test -p kdock-core --locked

      - name: Check workspace
        run: cargo check --workspace --locked

      - name: Build Tauri app (release)
        run: npm run tauri build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kdock-windows-x64
          # Fail loudly instead of publishing an empty artifact.
          if-no-files-found: error
          path: |
            ${{ env.CARGO_TARGET_DIR }}/release/*.exe
            dist/**
